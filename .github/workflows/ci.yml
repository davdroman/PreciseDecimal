name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "3 3 * * 2" # 3:03 AM, every Tuesday

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macOS:
    name: ${{ matrix.platform }} (Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS
          - macOS
          - tvOS
          - watchOS
        swift:
          - "5.10"
          - "6.0"
          - "6.1"
          - "6.2"
        include:
          - swift: "5.10"
            os: macos-14
          - swift: "6.0"
            os: macos-15
          - swift: "6.1"
            os: macos-15
          - swift: "6.2"
            os: macos-15
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5

      - name: Select Xcode version
        uses: mxcl/xcodebuild@v3
        with:
          swift: ~${{ matrix.swift }}
          action: none

      - if: matrix.platform != 'macOS'
        name: Download Required Runtimes
        run: xcodebuild -downloadPlatform ${{ matrix.platform }}

      - name: Test Library
        uses: mxcl/xcodebuild@v3
        with:
          swift: ~${{ matrix.swift }}
          platform: ${{ matrix.platform }}
          action: test
          scheme: PreciseDecimal
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift:
          - "5.10"
          - "6.0"
          - "6.1"
          - "6.2"
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v5
      - run: swift test
